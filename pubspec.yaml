name: fletter_demo_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^2.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.2.0
  in_app_review: ^2.0.12
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  equatable: ^2.1.0
  get_it: ^9.2.1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  rename_app: ^1.6.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  mocktail: ^1.0.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

rename_app:
  application_name: "SABEL"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/